<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETTribe Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .dashboard-container { max-width: 1200px; margin: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { margin-top: 0; color: #555; }
        .stat-card .value { font-size: 2em; color: #004a99; font-weight: bold; }
        .enquiries-table { width: 100%; border-collapse: collapse; background: white; }
        .enquiries-table th, .enquiries-table td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        .enquiries-table th { background-color: #004a99; color: white; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>SETTribe Chatbot Analytics</h1>
        
        <div class="stats-grid" id="stats">
            <div class="stat-card"><h3>Total Conversations</h3><div class="value" id="total-messages">0</div></div>
            <div class="stat-card"><h3>Total Enquiries</h3><div class="value" id="total-enquiries">0</div></div>
            <div class="stat-card"><h3>Human Handoffs</h3><div class="value" id="human-handoffs">0</div></div>
        </div>

        <h2>Recent Enquiries</h2>
        <table class="enquiries-table">
            <thead>
                <tr>
                    <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Course</th><th>Status</th>
                </tr>
            </thead>
            <tbody id="enquiries-body">
            </tbody>
        </table>
    </div>

    <script>
        async function fetchAnalytics() {
            try {
                const res = await fetch('http://127.0.0.1:8000/api/admin/analytics');
                const data = await res.json();
                document.getElementById('total-messages').innerText = data.total_messages;
                document.getElementById('total-enquiries').innerText = data.total_enquiries;
                document.getElementById('human-handoffs').innerText = data.human_handoffs;
            } catch (err) { console.error("Could not fetch analytics", err); }
        }

        async function fetchEnquiries() {
            try {
                const res = await fetch('http://127.0.0.1:8000/api/enquiry');
                const enquiries = await res.json();
                const tbody = document.getElementById('enquiries-body');
                tbody.innerHTML = enquiries.map(e => `
                    <tr>
                        <td>${e.id}</td>
                        <td>${e.name}</td>
                        <td>${e.email}</td>
                        <td>${e.phone}</td>
                        <td>${e.course_interest || '-'}</td>
                        <td>${e.status}</td>
                    </tr>
                `).join('');
            } catch (err) { console.error("Could not fetch enquiries", err); }
        }

        fetchAnalytics();
        fetchEnquiries();
    </script>
</body>
</html>
